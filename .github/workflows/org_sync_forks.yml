# Scheduled org job: fast-forward simp's pure-mirror forks from upstream
# ------------------------------------------------------------------------------
#
# This is NOT a reusable workflow — it runs here, on a schedule, and reaches
# out to the org through the API. There is no per-repo shim, because there is
# nothing in the module repos to trigger it. See simp/puppetsync#85 for why
# scheduled reconcilers belong in this repo.
#
# Replaces Backstroke, which the org used for this until ~2017 and whose
# server repo has been unmaintained since 2019-01. Uses GitHub's native
# `merge-upstream` API rather than a third-party app, so no external service
# holds write access to ~75 repos.
#
# ==============================================================================
# Secrets:
#
#   GitHub Secret variable               Notes
#   -------------------------------      ---------------------------------------
#   SIMP_APP_ID                          GitHub App (org-owned) used to mint a
#   SIMP_APP_PRIVATE_KEY                 short-lived installation token. This is
#                                        the preferred credential: the App holds
#                                        only Contents/Workflows/Actions write
#                                        plus Metadata read, its tokens last one
#                                        hour, and it is not tied to any user
#                                        account.
#
#   SIMP_AUTO_GITHUB_TOKEN__REPO_SCOPE   Fallback PAT (simp-auto). Used only if
#                                        the App secrets are absent. Note it
#                                        CANNOT sync forks whose upstream
#                                        modifies `.github/workflows/*` — it
#                                        lacks the `workflow` scope — and it
#                                        cannot bypass branch protection, since
#                                        simp-auto is an org member rather than
#                                        an admin. Both are why the App exists.
#
# This job writes to *other* repositories, so the workflow's own GITHUB_TOKEN
# can never be used. If neither credential resolves, the job fails rather than
# silently skipping.
#
# ------------------------------------------------------------------------------
# What it does, per non-archived fork in the simp org:
#
#   1. Resolve the fork's parent and both default branches.
#   2. Compare `simp:<default>` against `<parent>:<default>`.
#   3. Sync ONLY when the fork has **zero commits of its own** and is behind.
#
# Step 3 is the safety property. It is a pre-check, not a reliance on
# `merge-upstream` refusing: that endpoint reports a `merge_type` which can be
# a real merge rather than a fast-forward, so a diverged branch could pick up a
# merge commit. Requiring `ahead_by == 0` on our side means only strictly-behind
# branches are ever touched, and any fork that gains a SIMP-only commit drops
# out of the job automatically — no allow-list to maintain.
#
# Consequences worth knowing:
#
# * Only the **default branch** is synced. Side branches such as the historical
#   `simp-master` on many vendored forks are never touched, and neither are
#   tags. Those branches carry the org's pre-6.x SIMP patches.
#
# * Forks that carry SIMP patches are skipped by design, not by exception:
#   `pupmod-simp-haveged`, `pupmod-voxpupuli-selinux`, and
#   `puppet-module-skeleton` all fail the `ahead_by == 0` test. vox_selinux in
#   particular cannot be automated at all — its `selinux` -> `vox_selinux`
#   rename is committed to the fork, so every upstream change conflicts (330
#   commits behind, 176 files in the diff). That needs the namespace decision
#   in simp/puppetsync#68, not a sync job.
#
# * Forks whose **upstream is archived** are skipped: `merge-upstream` returns
#   404 for them. They are reported separately, since an archived upstream
#   usually means the fork is an archival candidate too.
#
# ==============================================================================
# Failure taxonomy
#
# `merge-upstream` is an API call, not a `git push` — but it still performs a
# ref update server-side, so branch protection and rulesets apply to it exactly
# as they would to a push. Every failure mode seen so far is a *permission or
# policy* problem on the fork, not a problem with the sync itself:
#
#   PAT needs the workflow scope
#       The incoming commits touch `.github/workflows/*`. A classic PAT is
#       refused unless it carries the `workflow` scope.
#       Fix: run with the GitHub App credential, whose Workflows: write
#       permission covers this. Only reachable on the PAT fallback path.
#
#   Fork requires linear history
#       `required_linear_history` is enabled on the fork while upstream merges
#       its PRs, so the incoming history contains merge commits. This is
#       structurally incompatible with mirroring and **no token scope fixes
#       it**. Fix: disable required_linear_history on mirror forks.
#
#   Branch protection / ruleset blocks the ref update
#       Required reviews, or an org-level ruleset, refusing a direct ref
#       update. Fix: grant the token a bypass, or exclude mirror forks from
#       the rule. Switching to PR-based sync is explicitly NOT the answer —
#       mirrors should update without review.
#
# The run FAILS if any fork fails, so a partly-broken sweep cannot look green.
#
---
name: 'ORG: Sync forks from upstream'

on:
  schedule:
    # Mondays 07:17 UTC — before the biweekly board review, off the hour to
    # avoid the top-of-hour scheduling backlog on GitHub's shared runners.
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report what would be synced, change nothing)'
        required: false
        type: boolean
        default: false
      repo_filter:
        description: 'Optional substring filter, to sync a single fork'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  sync-forks:
    name: 'Fast-forward pure-mirror forks'
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.SIMP_APP_ID }}
    steps:
      - name: 'Mint a GitHub App installation token'
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SIMP_APP_ID }}
          private-key: ${{ secrets.SIMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 'Assert a cross-repo credential is available'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.SIMP_AUTO_GITHUB_TOKEN__REPO_SCOPE }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo 'Using the GitHub App installation token.'
          elif [ -n "$PAT" ]; then
            printf '::warning ::Falling back to the simp-auto PAT. Forks whose '
            printf 'upstream changes .github/workflows/* will fail to sync.\n'
          else
            printf '::error ::No cross-repo credential available (set SIMP_APP_ID '
            printf '+ SIMP_APP_PRIVATE_KEY). This job writes to other repositories '
            printf 'and cannot use GITHUB_TOKEN.\n'
            exit 1
          fi

      - name: 'Sync eligible forks'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SIMP_AUTO_GITHUB_TOKEN__REPO_SCOPE }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO_FILTER: ${{ inputs.repo_filter }}
        run: |
          set -euo pipefail

          synced=0; current=0; skipped=0; failed=0; upstream_archived=0
          : > /tmp/failures.txt

          {
            echo '## Fork sync'
            [ "${DRY_RUN}" = 'true' ] && echo '**Dry run — no changes made.**'
            echo
            echo '| Fork | Upstream | Result |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          # Non-archived, non-empty forks in the org
          gh repo list simp --limit 500 --no-archived --json name,isFork,isEmpty \
            --jq '.[] | select(.isFork and (.isEmpty | not)) | .name' \
            | sort > /tmp/forks.txt

          while read -r repo; do
            if [ -n "${REPO_FILTER}" ] && [[ "$repo" != *"${REPO_FILTER}"* ]]; then
              continue
            fi

            meta="$(gh api "repos/simp/${repo}" \
              --jq '[.parent.full_name // "", .parent.default_branch // "", .default_branch] | @tsv')"
            parent="$(printf '%s' "$meta" | cut -f1)"
            parent_branch="$(printf '%s' "$meta" | cut -f2)"
            our_branch="$(printf '%s' "$meta" | cut -f3)"

            if [ -z "$parent" ]; then
              echo "::notice ::${repo}: no accessible parent, skipping"
              echo "| ${repo} | — | skipped (no parent) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            parent_owner="${parent%%/*}"

            # merge-upstream returns 404 when the upstream is archived
            if [ "$(gh api "repos/${parent}" --jq '.archived' 2>/dev/null)" = 'true' ]; then
              echo "::notice ::${repo}: upstream ${parent} is archived, skipping"
              echo "| ${repo} | ${parent} | skipped (upstream archived) |" >> "$GITHUB_STEP_SUMMARY"
              upstream_archived=$((upstream_archived + 1))
              continue
            fi

            # ahead_by  = commits upstream has that we lack
            # behind_by = commits we have that upstream lacks (i.e. SIMP patches)
            if ! cmp_json="$(gh api \
                  "repos/simp/${repo}/compare/simp:${our_branch}...${parent_owner}:${parent_branch}" \
                  --jq '[.ahead_by, .behind_by] | @tsv' 2>/dev/null)"; then
              echo "::warning ::${repo}: cannot compare against ${parent} (unrelated histories?)"
              echo "| ${repo} | ${parent} | skipped (compare failed) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            behind="$(printf '%s' "$cmp_json" | cut -f1)"   # we are behind by
            ours="$(printf '%s' "$cmp_json" | cut -f2)"     # our own commits

            if [ "$ours" -ne 0 ]; then
              echo "::notice ::${repo}: has ${ours} SIMP-only commit(s), not a pure mirror — skipping"
              echo "| ${repo} | ${parent} | skipped (${ours} local commit(s)) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            if [ "$behind" -eq 0 ]; then
              echo "| ${repo} | ${parent} | already current |" >> "$GITHUB_STEP_SUMMARY"
              current=$((current + 1))
              continue
            fi

            if [ "${DRY_RUN}" = 'true' ]; then
              echo "| ${repo} | ${parent} | would sync (${behind} behind) |" >> "$GITHUB_STEP_SUMMARY"
              synced=$((synced + 1))
              continue
            fi

            if result="$(gh api --method POST "repos/simp/${repo}/merge-upstream" \
                  -f "branch=${our_branch}" --jq '.merge_type' 2>&1)"; then
              echo "| ${repo} | ${parent} | synced ${behind} commit(s) (\`${result}\`) |" >> "$GITHUB_STEP_SUMMARY"
              synced=$((synced + 1))
            else
              case "$result" in
                *'workflow'*'scope'*)
                  cause='PAT needs the workflow scope' ;;
                *'must not contain merge commits'*)
                  cause='fork requires linear history; upstream uses merge commits' ;;
                *'protected branch'*)
                  cause='branch protection blocks the ref update' ;;
                *'rule violations'*)
                  cause='ruleset blocks the ref update' ;;
                *)
                  cause="$(printf '%s' "$result" | tr -d '\n' | cut -c1-120)" ;;
              esac
              echo "::error ::${repo}: ${cause}"
              echo "| ${repo} | ${parent} | **failed** — ${cause} |" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\t%s\n' "$cause" "$repo" >> /tmp/failures.txt
              failed=$((failed + 1))
            fi
          done < /tmp/forks.txt

          {
            echo
            echo "**synced ${synced} · already current ${current} · skipped ${skipped}"
            echo "· upstream archived ${upstream_archived} · failed ${failed}**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "synced=${synced} current=${current} skipped=${skipped}" \
               "upstream_archived=${upstream_archived} failed=${failed}"

          if [ "$failed" -gt 0 ]; then
            {
              echo
              echo '### Failures by cause'
              echo
              echo 'Each of these is a permission or policy problem on the fork.'
              echo 'Mirrors are meant to update without review, so the fix is to'
              echo 'let the token through — not to switch to PR-based syncing.'
              echo
              cut -f1 /tmp/failures.txt | sort -u | while read -r cause; do
                repos="$(grep -F "${cause}"$'\t' /tmp/failures.txt | cut -f2 | paste -sd', ' -)"
                echo "- **${cause}** — ${repos}"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            printf '::error ::%s of %s eligible forks failed to sync\n' \
              "$failed" "$((synced + failed))"
            exit 1
          fi
